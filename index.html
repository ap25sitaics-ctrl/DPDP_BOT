@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1120;--card:#111b2e;--tx:#e6edf7;--mu:#a3b3cb;--ln:#24324a;--ac:#8dbbff;--acs:#172a4d;--ok:#34d399;--oks:#0d2a22;--bad:#fca5a5;--bads:#341515;--am:#fbbf24;--ams:#2f2410;--user:#2b5fd9;--usert:#fff}}
:root[data-theme="dark"]{--bg:#0a1120;--card:#111b2e;--tx:#e6edf7;--mu:#a3b3cb;--ln:#24324a;--ac:#8dbbff;--acs:#172a4d;--ok:#34d399;--oks:#0d2a22;--bad:#fca5a5;--bads:#341515;--am:#fbbf24;--ams:#2f2410;--user:#2b5fd9;--usert:#fff}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:20}

header h1{margin:0;font-size:1.1rem}header small{color:var(--mu);display:block;font-size:.8rem}

.chip,.opt,.next{font:inherit;font-size:.88rem;font-weight:600;border:1px solid var(--ln);background:var(--card);color:var(--ac);border-radius:99px;padding:6px 12px;cursor:pointer;text-align:left}

<body>
<header>
  <div><h1>AIP-02 Deck Assistant</h1><small>Answers from the Facilitator Deck (33 slides) plus a DPDP and related-laws library. Runs in your browser; nothing is sent anywhere.</small></div>

  <div class="foot">Legal notes reflect public sources checked on 27 October 2026. Verify section numbers and dates with the official text and your legal cell.</div>

<script>
/*CORE*/
const SL=[
{n:1,t:"Facilitator Deck: Privacy, Federated Learning and Law",s:"A teaching deck for non-technical police officers. It teaches by activities, not lectures: how to share data safely, how federated learning works, and which laws apply.",b:["AIP-02 · 27 October 2026 · RRU Faculty","Interactive activities for non-technical officers","Every card, task and answer is on a slide; facilitator words are in the speaker notes"],nt:"Open Notes view (or Presenter view) on your laptop. Each slide has SAY, DO and TIME lines. You need only this deck and a projector.",k:"title intro deck overview aip-02 rru faculty about"},
{n:2,t:"How to use this deck",s:"Every activity runs in the same three steps: Rule, Task, Answer.",b:["Rule: read it aloud, give the time, say who answers","Task: the cards are on screen; groups of 4 or 5 work together","Answer: reveal it, but ask “why?” before you explain","You need only this deck and a projector","Groups of 4 or 5 at tables, mix ranks","Answers by voice, by fingers, or in a notebook"],nt:"SAY: “We will learn by doing. First I read the rule, then you work with the cards, then we check the answer together.” DO: Use the same rhythm every time. Never show the Answer slide before the room has answered.",k:"how to use rhythm rule task answer groups voice fingers notebook facilitator"},
{n:3,t:"Room rules for this audience",s:"Simple teaching habits: short, plain and group-based, so nobody is put on the spot.",b:["One idea per slide: say it, show it, stop","Ask first, tell second: “What do you think?” before the answer","Plain words only: use the dictionary on slide 4","Groups answer: safer than putting one officer on the spot","Break every 40 minutes: water, stretch, phones away","Use their stories: “Has a leak or wrong face ever hurt a case?”"],nt:"SAY at the start: “No one is tested here. Wrong answers are welcome: they teach the room.” DO: Use stories first, rules second. Ask a senior officer for a real example only if you ask before the session.",k:"tips room rules audience plain words breaks stories groups teaching"},
{n:4,t:"Plain words: say this, not that",s:"A dictionary that swaps technical words for everyday ones.",b:["Model → a rule of thumb the computer learns from past cases","Training → learning from the station’s own past cases","Weights → the lessons learned, written as numbers","Aggregate / FedAvg → combine the lessons; the bigger station counts more","Anonymization → removing identity so a stranger cannot tell who it is","k-anonymity → hiding in a crowd of at least three","Hash → a seal or fingerprint on a file"],nt:"SAY: “I will use ordinary words. If I use a technical word, stop me.” DO: Keep this slide in mind all day. When a technical word slips out, say the plain version.",k:"dictionary plain words glossary model training weights aggregate fedavg anonymization k-anonymity hash terms jargon meaning"},
{n:5,t:"Morning plan: 90 minutes",s:"The morning is 90 minutes (10:00 to 11:30) with five activities.",b:["0–10: Story, what went wrong? (Activity 1, slides 6–8)","10–25: Principles, the four questions (slide 8 and Privacy deck 3–4)","25–45: The cards game, the thana story (Activity 2, slides 9–13)","45–60: The lab on screen (slide 14)","60–75: Find the person (Activity 3, slides 15–17)","75–90: Red, amber, green (Activity 4), teach-back (Activity 5), take-away (slides 18–23)"],nt:"SAY: “This morning is about one idea: share the lesson, protect the source.” DO: Keep time. If you run short, skip the teach-back (Activity 5) and use the take-away slide.",k:"morning plan schedule time 10:00 11:30 90 minutes agenda timing session long"},
{n:6,t:"Activity 1: What went wrong?",s:"A short story about a leaked FIR. Groups answer three questions.",b:["Story (illustrative): a copy of an FIR for a sexual offence is forwarded in a district WhatsApp group","It shows the victim’s name and her address","A local page posts it; by evening many people have seen it","Question 1: Who is harmed?","Question 2: Which rule was broken?","Question 3: What should the officer have done?"],nt:"TIME: 8 minutes. SAY: “In groups, answer the three questions. You have three minutes.” DO: Read the story aloud slowly. Take two answers per question from different tables.",k:"activity 1 what went wrong fir leak whatsapp victim story task"},
{n:7,t:"Activity 1: Answer",s:"The leak happened at the Share step. The officer was careless about the copy, not about the crime.",b:["Who is harmed: the victim (safety and shame), witnesses, the case (the accused can pressure her), public trust","Rule broken: protect the victim’s identity (the law); share only the minimum; use the official channel","What to do: share only the needed facts by official channel using the case number; mask identity; report the leak and contain it; never forward to groups","Most leaks happen at the Share step"],nt:"SAY: “Notice where it went wrong: at the Share step. The officer was not careless about the crime. He was careless about the copy.” ASK: “Has this happened in your district?” Take one story.",k:"activity 1 answer harmed rule broken what to do share step leak victim identity"},
{n:8,t:"The four questions card",s:"Before you share anything, ask four questions: Need, Minimum, Hidden, Logged.",b:["1 NEED: do I need to share it, and for what purpose? Example: a bank needs the account number, not the victim’s full file","2 MINIMUM: is it the least data for that purpose? Example: one number and one week, not six months of calls","3 HIDDEN: are name, phone, address and photo hidden? Example: “Victim A”, not her name","4 LOGGED: is it approved and written in a log? Example: official email with an entry in the register"],nt:"SAY: “Before you share anything, ask four questions. Need. Minimum. Hidden. Logged.” DO: Have the whole room say the four words together twice. This card returns in every activity today.",k:"four questions card need minimum hidden logged principles share"},
{n:9,t:"Federated learning: the thana story",s:"Federated learning in police terms: each station keeps its own FIRs and sends only lessons to headquarters.",b:["Headquarters combines the lessons","Station A, Station B and Station C: their own FIRs stay","Protect the source. Share the lesson."],nt:"SAY: “At the monthly crime review, each SHO brings lessons, not case files. The SP combines the lessons and sends back one circular. That is federated learning. The computer does the same: each station learns from its own records and only the lessons travel.” DO: Point to each box. Stress: the FIRs never leave the thana.",k:"federated learning thana story headquarters station sho sp circular lessons source idea"},
{n:10,t:"Activity 2: The cards game, rules",s:"Each station counts its own night cards and sends only a slip to headquarters.",b:["1 Split: Station A, B, C and Headquarters (HQ)","2 Count: each station counts the dark N (night) cards in its own stack","3 Slip: write “N out of total” and send only the slip to HQ","4 Add: HQ adds up the slips; cards never leave the table","Time: 8 minutes. Only the slips travel"],nt:"TIME: 3 minutes to explain. SAY: “Imagine three police stations. Each has a stack of theft cards, day or night. Headquarters wants to know: what share of thefts happen at night? Headquarters may not see any card.” DO: Split the room into four. If the room is small, use three groups and you act as HQ.",k:"activity 2 cards game rules split count slip add night theft how to run"},
{n:11,t:"Activity 2: Count your cards",s:"The three card stacks and the counting task.",b:["Station A: 30 cards; Station B: 20 cards; Station C: 10 cards","N (dark) = night theft; D (light) = day theft","Count only the N cards of your own station","Expected: A has 9 of 30, B has 6 of 20, C has 9 of 10"],nt:"TIME: 4 minutes. SAY: “Station A: count the dark N cards in the first stack. Station B: the second. Station C: the third. Write your slip.” DO: Walk the room. Check each group gets 9 of 30, 6 of 20 and 9 of 10. Do not tell them the HQ answer yet.",k:"activity 2 count cards stacks night day 30 20 10 dark"},
{n:12,t:"Activity 2: Slips and answer",s:"HQ adds the tops and bottoms of the slips: 24 of 60 = 40% of thefts at night, without seeing a single card.",b:["Slips: Station A 9 of 30, Station B 6 of 20, Station C 9 of 10","Headquarters: 24 of 60 = 40%","Why not average the percentages? 30%, 30% and 90% average to 50%, which is wrong because Station C has only 10 cards","Right way: add the tops and the bottoms; the bigger station counts more; the computer does the same and it is called a weighted average"],nt:"SAY: “Headquarters got three slips and never saw a card. 9 of 30, 6 of 20, 9 of 10. Add the tops: 24. Add the bottoms: 60. So 24 out of 60, which is 40 percent at night.” ASK: “What if I just average 30, 30 and 90?” (50 percent) “Why is that wrong?”",k:"activity 2 answer slips weighted average 40 percent 24 60 fedavg average wrong"},
{n:13,t:"Activity 2: What travelled, what stayed",s:"Slips travelled, cards stayed. In the lab the slips are the weights and the cards are the raw FIR data.",b:["Travelled: the slips (in the lab: the weights)","Stayed: the cards (in the lab: the raw FIR data)","Result: HQ still got a good answer, 40% at night, from all three areas","Same idea as: protect the source, share the assessment"],nt:"SAY: “Think about what happened. What moved? What stayed?” ASK: “Would the answer be better if HQ saw all the cards?” (Slightly. But the cost is privacy.) “Which would your Station Head prefer?” LINK: In the computer lab, the slips are the weights.",k:"debrief travelled stayed weights slips cards raw data result"},
{n:14,t:"The lab: what to click and say",s:"A live demo website with four tabs that shows the same ideas on screen. Let a volunteer click while you speak.",b:["Tab 1 Concept map: drag the 7 cards. Say: “Records stay. Only lessons travel.”","Tab 2 Anonymize first: drag four chips onto four columns. Say: “k is how many look alike. We want 3 or more.”","Tab 3 Train rounds: press Guide me, then Next step four times. Say: “Send the model, learn locally, send lessons, combine.”","Tab 3 try this: drag Raw FIR data to Main. Say: “Refused. Records never leave.”","Tab 4 Allowed or not?: drag 8 cards. Say: “Each answer links to a rule we learned.”","Link: https://ap25sitaics-ctrl.github.io/federated_learning/"],nt:"DO: Open the link on the projector before the class. If the internet fails, skip to Activity 3, then run the lab after the break. KEEP IT SHORT: 15 minutes. REMEMBER: do not explain the numbers. Say, “these numbers are the lessons learned”.",k:"lab demo live website tabs concept map anonymize train rounds allowed or not link github federated_learning internet fails click"},
{n:15,t:"Activity 3: Find the person, round 1",s:"Round 1 shows a crime list with exact details. Anyone can find a person in seconds.",b:["Table of 12 invented people with exact name, age, PIN and offence","Task: find the record of the 45-year-old in PIN 110042","Answer: Seema Gill, 45, PIN 110042, fraud","Everyone is unique: age and PIN together point to one person"],nt:"TIME: 3 minutes. SAY: “This is a crime list (invented names). Your neighbour says she is 45 and lives in PIN 110042. Find her record.” DO: Give 30 seconds. Someone will answer at once. Say: “It took you seconds. The record stood out.”",k:"activity 3 find the person round 1 seema gill 110042 age pin unique"},
{n:16,t:"Activity 3: Find the person, round 2",s:"Round 2 shows the anonymised list: IDs, age bands and partial PIN. Now nobody can be sure which record is hers.",b:["IDs P-001 to P-012 instead of names","Age bands (20–29, 30–39, 40–49) instead of exact ages","PIN area 110XXX instead of the full PIN","Task: find the 45-year-old in PIN 110042 again. Can you be sure?","Three records fit: age band 40–49 in area 110"],nt:"SAY: “Now the list is anonymised. Names are IDs. Ages are in tens. PIN codes show only the first three digits. Find her again.” DO: Give 30 seconds. Nobody can be sure. Count with them: three records in 40–49 and area 110.",k:"activity 3 round 2 anonymised ids age band pin area 110xxx"},
{n:17,t:"Activity 3: Answer",s:"Round 1 had k = 1 (she stands out). Round 2 has k = 3 (three records look alike, so nobody stands out). This is k-anonymity.",b:["Round 1, k = 1: exact age and exact PIN; she is the only one","Round 2, k = 3: age band 40–49, PIN area 110; three records look alike","Hiding in a crowd of at least three","In the lab: tab 2, Anonymize first","What we lost: exact age and exact PIN; the data is still good for counting offences by area"],nt:"SAY: “You cannot be sure. Three records fit: ages 42, 45 and 41 are all in the 40 to 49 band. That is hiding in a crowd of three. The technical name is k-anonymity, and k is 3.” ASK: “What did we lose?”",k:"activity 3 answer k-anonymity k=1 k=3 crowd hide anonymization lose"},
{n:18,t:"Activity 4: Red, amber, green, rules",s:"A finger-voting game: one finger red (do not share), two amber (share after changes), three green (fine with approval and a log).",b:["RED, 1 finger: do not share","AMBER, 2 fingers: share only after changes","GREEN, 3 fingers: fine to share, with approval and a log","Use the four questions card: need, minimum, hidden, logged"],nt:"TIME: 12 minutes for all four cases. SAY: “Count to three. On three, everyone shows fingers at the same time. No copying.” DO: Practise once with an easy case: sharing the traffic fine list with the court is green.",k:"activity 4 red amber green rules vote fingers traffic light"},
{n:19,t:"Activity 4: Cases 1 and 2",s:"Two cases to vote on: a CCTV still to a WhatsApp group, and crime data with home addresses to a university.",b:["Case 1: a CCTV still of a chain-snatching suspect, sent to a local WhatsApp group to identify him","Case 2: crime data with exact home addresses, sent to a university research team","Vote: 1, 2 or 3 fingers"],nt:"TIME: 5 minutes. SAY: “Case 1. Count three. Show fingers.” Then ask one red voter and one non-red voter to explain. Do the same for Case 2. Do not reveal yet.",k:"activity 4 case 1 case 2 cctv chain snatching whatsapp university addresses"},
{n:20,t:"Activity 4: Cases 3 and 4",s:"Two more cases: a witness statement pasted into a public AI chatbot, and one suspect’s call records for one week with written authorisation.",b:["Case 3: a witness statement pasted into a public AI chatbot to summarise it","Case 4: call records of ONE suspect for ONE week, with written authorisation, given to the investigating officer","Vote: 1, 2 or 3 fingers"],nt:"TIME: 5 minutes. SAY: “Case 3 and Case 4.” Same method. Then show the answer slide.",k:"activity 4 case 3 case 4 witness statement ai chatbot call records suspect authorisation"},
{n:21,t:"Activity 4: Answers",s:"Case 1 red, Case 2 red then amber, Case 3 red, Case 4 green. Use the four questions on each.",b:["Case 1, CCTV still to WhatsApp: RED. Unverified face, public naming, an innocent person may be harmed. Fix: verify first; official spokesperson; verified image only","Case 2, addresses to university: RED then AMBER. Exact addresses identify victims. Fix: use PIN area, age bands, sign an agreement","Case 3, statement into AI chatbot: RED. A public tool keeps the text and exposes the witness. Fix: use official tools, or cleaned and invented text only","Case 4, one suspect, one week: GREEN. Minimum data, written authority. Fix: log it; delete the working copy"],nt:"SAY: “There is no trick. Use the four questions.” For each case ask the red voters why, then give the answer. Case 1: red until verified; even then use the official spokesperson. Case 2: red as it stands, amber if addresses become PIN areas and an agreement is signed. Case 3: red. Case 4: green: minimum, approved, logged.",k:"activity 4 answers red amber green case 1 2 3 4 why fix"},
{n:22,t:"Activity 5: Teach your neighbour",s:"Each person explains in their own words why HQ never saw an FIR but still got the answer.",b:["Question: why did headquarters never see a single FIR, and still learn the answer?","One minute each. No slides. No notes","A good answer, point 1: the records stayed at each station","Point 2: only the lessons (numbers) travelled","Point 3: HQ combined them, the bigger station counting more"],nt:"TIME: 5 minutes. SAY: “Turn to your neighbour. You have one minute each.” DO: Listen to two pairs. Check that they say: cards stayed, slips travelled, combined by size.",k:"activity 5 teach back neighbour own words headquarters never saw fir"},
{n:23,t:"Morning take-away: before you share",s:"Five questions to ask before you share anything, plus one reminder.",b:["Do I need it, and for what purpose?","Is it the minimum for that purpose?","Are names, phones, addresses and photos hidden?","Am I using an official channel, and is it logged?","Will the copy be deleted when the task ends?","Leads are not proof. Identity stays protected until the law allows otherwise."],nt:"SAY: “If you remember only one thing today: protect the source, share the lesson. And before you share anything, ask five questions.” DO: Ask the room to repeat the five questions, then close the morning.",k:"take-away five questions before you share delete leads not proof official channel"},
{n:24,t:"Afternoon plan: 60 minutes",s:"The afternoon is 60 minutes (14:30 to 15:30) about the law in plain words.",b:["0–5: Story, a bank fraud call (slide 25)","5–20: The four drawers (slide 26)","20–40: Drawer sort, Activity 6 (slides 27–28)","40–55: Scenario drills, Activity 7 (slides 29–30)","55–60: Decision card, pocket card, close (slides 31–33)"],nt:"SAY: “This afternoon is the law, in plain words. We will not memorise sections. We will learn four drawers and where each case goes.” DO: Keep the pocket card slide for the end.",k:"afternoon plan schedule time 14:30 15:30 60 minutes agenda timing session long"},
{n:25,t:"Story: the bank fraud call",s:"A story to open the law session: a retired officer shares an OTP with a fake bank caller and loses Rs 2 lakh.",b:["A retired officer gets a call from “bank staff”","He shares an OTP; within an hour Rs 2 lakh moves through three accounts","He calls the police","Ask the room: which laws touch this case? Shout out any words"],nt:"TIME: 5 minutes. SAY: “This is illustrative, but you have seen it.” ASK: “Which laws touch this case?” Take guesses. Write the words: IT Act, FIR, evidence, data.",k:"story bank fraud call otp rs 2 lakh retired officer laws hook"},
{n:26,t:"The four drawers",s:"Think of an almirah with four drawers. Every legal question goes into one: the crime, the procedure, the evidence, or the care of data.",b:["A IT Act 2000: the crime (fake bank call, hacking, deepfakes)","B BNSS 2023: the procedure (FIR, summons for records, recording a seizure)","C Evidence Act 2023: the evidence (certificate and hash for a screenshot)","D DPDP Act 2023: the care of data (keep it safe, minimum, delete later)","Every case uses all four drawers; today we practise sorting"],nt:"SAY: “Think of four drawers in an almirah. Every legal question goes into one of them.” DO: Read each drawer slowly with its example. This is the whole map; details come later.",k:"four drawers map it act bnss evidence act dpdp law almirah legal"},
{n:27,t:"Activity 6: Drawer sort",s:"Eight slips. For each one, say which drawer it belongs to: A, B, C or D.",b:["Slip 1: fake bank call asking for an OTP","Slip 2: register the complaint online as an e-FIR","Slip 3: write to the bank for transaction records","Slip 4: hash and certify the screenshot","Slip 5: keep the victim’s data locked and logged","Slip 6: ask the platform to remove a deepfake","Slip 7: video-record the seizure of a phone and laptop","Slip 8: give the bank only the details it needs","Drawers: A IT Act (crime), B BNSS (procedure), C Evidence Act (proof), D Data protection (care)"],nt:"TIME: 12 minutes. SAY: “Eight slips. For each, call out the drawer letter. Groups answer together. Write your answers in your notebook.” DO: Give 4 minutes. Then show the answer slide. Ask groups to score themselves.",k:"activity 6 drawer sort slips a b c d"},
{n:28,t:"Activity 6: Answers",s:"Answers: 1 A, 2 B, 3 B, 4 C, 5 D, 6 A, 7 B, 8 D.",b:["Slip 1 Fake bank call, OTP → A IT Act: cheating by personation, identity theft (66D, 66C)","Slip 2 Register as e-FIR → B BNSS: FIR including electronic (s.173)","Slip 3 Write to bank for records → B BNSS: order to produce documents (s.94)","Slip 4 Hash and certify screenshot → C Evidence Act: certificate under s.63","Slip 5 Keep victim data locked, logged → D Data protection: security safeguards","Slip 6 Ask platform to remove deepfake → A IT Act and the platform rules","Slip 7 Video-record seizure → B BNSS: audio-video recording (s.105)","Slip 8 Give the bank only what it needs → D Data protection: minimum data"],nt:"SAY: “Check your score. Seven or eight is excellent. Four or less: do not worry, the pocket card will help.” ASK, for each wrong answer: “What made it look like another drawer?” Many cases touch two drawers: that is normal.",k:"activity 6 answers drawer sort 66c 66d 173 94 63 105 score fir seizure deepfake"},
{n:29,t:"Activity 7: Three real-life drills",s:"Three drills for groups: a Telegram threat from abroad, a constable leaking a victim’s chat, and a CCTV vendor using its own cloud.",b:["Drill 1: a Telegram channel run from abroad threatens a rally. Which laws apply? What are your first three steps?","Drill 2: a constable posts a victim’s chat screenshot in a WhatsApp group. What rules were broken? What now?","Drill 3: a private CCTV vendor stores police footage on its own cloud. What do you demand in the contract?"],nt:"TIME: 12 minutes. SAY: “Each group takes one drill. Use the decision card on the next slides. Three minutes to prepare, two minutes to present.” DO: Assign drills by table. If you have fewer groups, run all three yourself as questions.",k:"activity 7 drills telegram channel abroad constable whatsapp cctv vendor cloud contract scenario"},
{n:30,t:"Activity 7: Model answers",s:"Model answers for the three drills. Yours may differ; the test is whether you asked need, minimum, hidden, logged.",b:["Drill 1: the IT Act reaches offences abroad that involve computers in India (s.75). Steps: 1 preserve and hash the posts; 2 alert the control room and unit; 3 ask the platform and request blocking through the proper channel (the Centre blocks; confirm the route with the legal cell)","Drill 2: broken: confidentiality, victim identity, security rules. Now: ask for removal, find who saw it, note it, start a departmental inquiry, and inform the victim as appropriate","Drill 3: a written contract: the vendor acts only on our instructions; security standards; no other use; report any breach; retention and deletion; access logs; where data is stored; right to audit"],nt:"SAY: “These are model answers. Yours may differ. The test: did you ask need, minimum, hidden, logged?” NOTE: Where a step needs a legal order, say “confirm the exact route with the legal cell”. Do not promise a result.",k:"activity 7 model answers drill 1 2 3 section 75 blocking contract vendor steps"},
{n:31,t:"The decision card",s:"Six questions to ask before any data request: Law, Purpose, Minimum, Approval, Log, Proof.",b:["1 LAW: what law allows it?","2 PURPOSE: what is the aim?","3 MINIMUM: what is the least data?","4 APPROVAL: who approves it?","5 LOG: is it logged?","6 PROOF: is the evidence certified?"],nt:"SAY: “Before any data request, ask these six questions. Put them on a card in your pocket.” DO: Ask them to copy these six lines into their notebooks now.",k:"decision card pocket six questions law purpose minimum approval log proof"},
{n:32,t:"Pocket card: six numbers",s:"Six legal section numbers for everyday work. Always check them against the current law text and confirm with the legal cell.",b:["Evidence Act (BSA) 2023, s.63: certificate for electronic records, with hash","IT Act 2000, 66C and 66D: identity theft; cheating by personation","IT Act 2000, 69 and 69A: interception and blocking, only by proper order","BNSS 2023, s.173: FIR, including online","BNSS 2023, s.94: order to produce documents or things","DPDP Act 2023, s.17: investigation exemptions, conditional; keep data safe","Check section numbers against the current text before use. Confirm with the legal cell."],nt:"SAY: “Six numbers are enough for everyday work. For everything else, ask the legal cell.” WARN: Laws and rules change. Check each number against the current text before quoting it in a case.",k:"pocket card six numbers sections 63 66c 66d 69 69a 173 94 17 evidence act it act bnss dpdp section"},
{n:33,t:"Closing: three lines to remember",s:"Three lines to remember from the whole day.",b:["Protect the source. Share the lesson.","A tool result is a lead, not proof.","Minimum data. Hidden identity. Logged."],nt:"SAY: “Three lines. Protect the source, share the lesson. A lead is not proof. Minimum, hidden, logged. Thank you.” DO: Ask each group for one thing they will change in their unit next week.",k:"closing three lines remember source lesson lead not proof minimum hidden logged"}

const FQ=[
{q:"What is federated learning?",k:"federated learning fl explain meaning what is simple",a:"Federated learning means each place keeps its own records and learns from them locally. Only the lessons (numbers called weights) are sent to a central place, which combines them.\nIn the deck’s story, each police station keeps its FIRs, sends lessons to headquarters, and headquarters combines them. Protect the source, share the lesson.",src:[9,13,14]},
{q:"What are weights?",k:"weights weight what are weights lessons numbers meaning mean explain",a:"Weights are the lessons the computer learned, written as numbers. In the cards game they are the slips (like “9 of 30”). They travel; the raw FIR data stays at the station.",src:[4,13]},
{q:"What is k-anonymity?",k:"k anonymity k-anonymity crowd what is explain",a:"Hiding in a crowd of at least k people. If three records look exactly alike (same age band and area), nobody stands out, so k = 3.\nIn Round 1 she was unique (k = 1). In Round 2 three records fit (k = 3). The cost: you lose exact age and exact PIN, but the data still works for counting offences by area.",src:[17,16,4]},
{q:"What is anonymization?",k:"anonymization anonymisation anonymize what is mean remove identity",a:"Removing identity so a stranger cannot tell who a record is about. Names become IDs, exact ages become age bands, and full PIN codes become areas. Do it before sharing.",src:[4,16,17]},
{q:"What is a hash?",k:"hash fingerprint seal sha what is",a:"A seal or fingerprint on a file. If the file changes at all, the fingerprint changes. It is used with the s.63 Evidence Act certificate to show an electronic record was not altered.",src:[4,28,32]},
{q:"Why not average the percentages? (weighted average)",k:"weighted average why not average percentages fedavg aggregate 40 percent",a:"Because a bigger station counts more. Averaging 30%, 30% and 90% gives 50%, which is wrong as Station C has only 10 cards.\nAdd the tops and the bottoms instead: 9 + 6 + 9 = 24 out of 30 + 20 + 10 = 60, which is 40%.",src:[12]},
{q:"What are the four questions?",k:"four questions need minimum hidden logged",a:"Need (do I need to share it, and why?), Minimum (is it the least data?), Hidden (are name, phone, address and photo hidden?), Logged (is it approved and written in a log?).",src:[8,23]},
{q:"What are the six decision-card questions?",k:"decision card six questions law purpose minimum approval log proof",a:"Law, Purpose, Minimum, Approval, Log, Proof. Ask them before any data request.",src:[31]},
{q:"How do red, amber and green work?",k:"red amber green fingers vote meaning",a:"Red (1 finger) = do not share. Amber (2 fingers) = share only after changes. Green (3 fingers) = fine to share, with approval and a log.",src:[18,21]},
{q:"What are the four drawers?",k:"four drawers a b c d it act bnss evidence dpdp",a:"A IT Act 2000 (the crime), B BNSS 2023 (the procedure), C Evidence Act 2023 (the evidence), D DPDP Act 2023 (the care of data). Every case uses all four drawers.",src:[26,28]},
{q:"Which section numbers should I know?",k:"section numbers sections which section law 63 66c 66d 69 69a 173 94 17 fir evidence certificate",a:"s.63 Evidence Act (BSA): certificate for electronic records, with hash.\n66C and 66D IT Act: identity theft; cheating by personation.\n69 and 69A IT Act: interception and blocking, only by proper order.\ns.173 BNSS: FIR, including online.\ns.94 BNSS: order to produce documents or things.\ns.17 DPDP Act: conditional investigation exemptions.\nThe deck says to check each number against the current law text and confirm with the legal cell.",src:[32,28]},
{q:"Why did HQ never see an FIR but still learn the answer?",k:"why headquarters never saw fir still learn answer teach back",a:"1. The records stayed at each station. 2. Only the lessons (numbers) travelled. 3. HQ combined them, with the bigger station counting more.",src:[22,12]},
{q:"Where do leaks usually happen?",k:"where leaks happen share step leak",a:"Most leaks happen at the Share step. The officer is not careless about the crime but about the copy.",src:[7]},
{q:"Can I paste a witness statement into a public AI chatbot?",k:"paste witness statement public ai chatbot chatgpt gemini allowed",a:"No. The deck rates it RED. A public tool keeps the text and exposes the witness. Use official tools, or cleaned and invented text only.",src:[21,20]},
{q:"Where is the lab and what do I click?",k:"lab link website url demo github click tabs",a:"The lab is at https://ap25sitaics-ctrl.github.io/federated_learning/. It has four tabs: Concept map, Anonymize first, Train rounds, and Allowed or not? Open it on the projector before class. If the internet fails, skip to Activity 3 and run the lab after the break.",src:[14]},
{q:"What are the teaching tips for this deck?",k:"teaching tips facilitator rhythm how to teach run groups",a:"Use the same rhythm every time: Rule, Task, Answer. Work in groups of 4 or 5. Ask first, tell second. Use plain words. Take a break every 40 minutes. Never show the Answer slide before the room has answered.",src:[2,3]},
{q:"What if I run short of time?",k:"short time run out skip internet fails cut",a:"Skip the teach-back (Activity 5) and use the take-away slide. If the internet fails, skip the lab, do Activity 3, and run the lab after the break.",src:[5,14]},
{q:"What does “a lead is not proof” mean?",k:"lead not proof evidence tool result",a:"A tool result is a lead, not proof. Identity stays protected until the law allows otherwise, and evidence needs a certificate (s.63) with a hash.",src:[33,23,32]}

const LAW=[
{q:"All laws and rules connected with the DPDP Act",k:"all laws acts related list library connected rules legal framework which laws acts and laws",a:"Core data-protection law:\n• Digital Personal Data Protection Act, 2023 (DPDP Act)\n• Digital Personal Data Protection Rules, 2025\n• Laws the DPDP Act changes: IT Act 2000 (s.43A omitted; s.81 proviso and s.87(2)(ob) changed), RTI Act 2005 (s.8(1)(j)), TRAI Act 1997 (s.14: appeals to the DPDP Appellate Tribunal)\n\nLaws police use together with it:\n• Constitution Article 21 and the Puttaswamy privacy judgment (2017)\n• IT Act 2000 and its rules (SPDI 2011, interception 2009, blocking 2009, Intermediary Rules 2021) and CERT-In directions (2022)\n• BNSS 2023 (procedure), BSA 2023 (electronic evidence), BNS 2023 (offences)\n• Aadhaar Act 2016 and Telecommunications Act 2023\n• Victim and child identity: BNS (old IPC 228A), POCSO Act 2012 s.23, Juvenile Justice Act 2015 s.74\n• Official Secrets Act 1923 and service conduct rules\nTap a topic below or ask about any of them by name.",ch:["Is the DPDP Act in force now?","What is the DPDP Act 2023?","Key DPDP sections at a glance","DPDP s.17: exemptions for police","IT Act 2000: sections for data and policing","BSA 2023: the s.63 certificate","Laws that protect victim and child identity","Puttaswamy and the proportionality test"]},
{q:"Is the DPDP Act in force now? Timeline",k:"dpdp in force now status timeline commencement phases 2025 2026 2027 when effective rules notified november operational date",a:"As of 27 October 2026 the DPDP framework is only partly in force.\n• 13 Nov 2025: the DPDP Rules, 2025 were notified. The Data Protection Board of India was set up, and the definitions and Board rules took effect at once.\n• 13 Nov 2026 (12 months): the consent-manager provisions (s.6(9), s.27(1)(d), Rule 4) start.\n• 13 May 2027 (18 months; some sources say 12 May): everything else starts, including notice and consent duties, data fiduciary obligations, children’s data, rights of data principals, cross-border rules, the s.17 exemptions, penalties, and the omission of IT Act s.43A.\nUntil then s.43A and the SPDI Rules 2011 still apply to body corporates.\nThis follows law-firm and press reports of the 13 Nov 2025 notifications. Confirm the exact dates in the Gazette with your legal cell.",rf:[32,26]},
{q:"What is the DPDP Act 2023?",k:"dpdp act 2023 what is digital personal data protection overview meaning explain data principal data fiduciary data processor simple words",a:"India’s main law for digital personal data (Act 22 of 2023, passed in August 2023). It covers personal data in digital form, or paper data that is later digitised. In plain words:\n• Data Principal = the person the data is about\n• Data Fiduciary = whoever decides why and how the data is used (a police unit, a bank, a company)\n• Data Processor = someone who handles data for the fiduciary (a vendor)\n• Processing needs consent or a ‘legitimate use’, and the person must get a clear notice\n• Duties: keep data secure, collect only what is needed, delete it when done, report breaches\n• Rights: to know, correct, erase, complain and nominate someone\n• Regulator: the Data Protection Board of India; appeals go to TDSAT\n• It has money penalties, not criminal offences.",rf:[26,4]},
{q:"Key DPDP sections at a glance",k:"dpdp sections section numbers s.4 s.5 s.6 s.7 s.8 s.9 s.10 s.11 s.12 s.13 s.14 s.15 s.16 s.17 s.33 s.36 s.44 chapter at a glance table list",a:"s.4 Lawful grounds for processing (consent or legitimate use)\ns.5 Notice to the person\ns.6 Consent: clear, specific, can be withdrawn; s.6(9) consent managers\ns.7 Certain legitimate uses (for example State benefits, legal duties, medical emergencies, employment)\ns.8 Duties of the Data Fiduciary: 8(1) accountable for compliance; 8(5) reasonable security safeguards; 8(6) tell the Board and affected people about a breach; 8(7) erase data when the purpose ends\ns.9 Children (under 18): verifiable parent consent\ns.10 Significant Data Fiduciaries\ns.11–14 Rights: information, correction and erasure, grievance redressal, nominate\ns.15 Duties of the Data Principal\ns.16 Transfer outside India (allowed except to countries the Government restricts)\ns.17 Exemptions\ns.18–28 Data Protection Board\ns.33 Penalties (see the Schedule)\ns.36 Government can call for information\ns.44 Amends other Acts\nConfirm numbers against the official text.",rf:[32]},
{q:"DPDP s.17: exemptions for police and investigation",k:"s.17 section 17 exemption exempt police investigation law enforcement prevention detection prosecution offence instrumentality state security notified 17(1)(c) 17(2) dpdp",a:"What s.17 says, in plain words:\n• s.17(1): for listed cases, including the prevention, detection, investigation or prosecution of any offence (s.17(1)(c)), the Act’s rules on notice, consent and data-principal rights do not apply. Chapter II (except s.8(1) and s.8(5)), Chapter III and s.16 are switched off.\n• Even when exempt, the data fiduciary stays accountable (s.8(1)) and must keep reasonable security safeguards (s.8(5)). That is why the deck says ‘conditional; keep data safe’.\n• s.17(2)(a): the Central Government can, by notification, exempt a State instrumentality from the whole Act for reasons such as security of the State, sovereignty, public order or friendly relations with foreign States.\nCautions: s.17 starts on the 18-month date (13 May 2027). Its scope is contested, and s.17(1)(c) and s.17(2) are among the provisions challenged in the Supreme Court (heard 7 August 2026). The right to privacy (Article 21, Puttaswamy) still applies: a legal basis, a legitimate aim, necessity and proportionality, and safeguards.",rf:[32,31]},
{q:"DPDP penalties",k:"dpdp penalty penalties fine crore schedule 250 crore security safeguards board money",a:"The Board can impose money penalties after an inquiry (s.33 and the Schedule), from 13 May 2027:\n• Failure to keep reasonable security safeguards: up to ₹250 crore\n• Failure to notify the Board and affected people of a breach: up to ₹200 crore\n• Breach of children’s-data duties: up to ₹200 crore\n• Breach of Significant Data Fiduciary duties: up to ₹150 crore\n• Any other breach of the Act or Rules: up to ₹50 crore\n• Breach of duties by a Data Principal: up to ₹10,000\nThere are no jail terms in the DPDP Act. Offences such as hacking and cheating stay under the IT Act and BNS. Appeals go to TDSAT."},
{q:"DPDP Rules 2025: what do they add?",k:"dpdp rules 2025 notified highlights notice security safeguards breach notification retention erasure children parental consent board consent manager rule 4 rule 17 rule 23",a:"The Rules (notified 13 Nov 2025) turn the Act into practice:\n• Notice: a plain, itemised notice to the person\n• Consent managers: registration and duties (Rule 4; from 13 Nov 2026)\n• Security safeguards: measures such as encryption, access control and logs\n• Breach: tell affected people without delay, and give the Board the details\n• Time limits for keeping and erasing data\n• Children’s data: verifiable parental consent\n• Data Protection Board: constitution, digital office and procedure (Rules 17–21)\n• The Government can call for information (Rule 23)\nTreat rule numbers as pointers and check the Gazette.",rf:[26]},
{q:"Puttaswamy judgment and the proportionality test",k:"puttaswamy privacy fundamental right article 21 proportionality test 2017 legality legitimate aim necessity safeguards supreme court",a:"In Justice K.S. Puttaswamy v. Union of India (2017), a nine-judge Supreme Court bench held that privacy is a fundamental right under Article 21. When the State limits privacy, courts look for: (1) a law that backs it (legality), (2) a legitimate aim, (3) necessity and proportionality, and (4) safeguards against abuse. The later Aadhaar judgment (2018) applied this test.\nThis is why the deck’s four questions (Need, Minimum, Hidden, Logged) and the decision card (Law, Purpose, Minimum, Approval, Log, Proof) matter.",rf:[8,31]},
{q:"IT Act 2000: sections for data and policing",k:"it act 2000 information technology act sections 43 43a 66 66c 66d 66e 67 69 69a 69b 70b 72 72a 79 81 intermediary cert-in hacking identity theft",a:"s.43, s.66: unauthorised access, damage and computer offences (hacking)\ns.66C: identity theft\ns.66D: cheating by personation using a computer\ns.66E: capturing or sharing private images of a person\ns.67: obscene material in electronic form\ns.69: interception, monitoring and decryption by order (safeguards in the 2009 Rules)\ns.69A: blocking public access to information by order\ns.69B: monitoring traffic data for cyber security\ns.70B: CERT-In, the national cyber incident agency\ns.72: breach of confidentiality and privacy by a person who got access using powers under the Act\ns.72A: disclosure of information in breach of a lawful contract\ns.79: intermediary safe harbour (conditions in the 2021 Rules)\ns.43A: compensation for failing to protect sensitive data (to be omitted from 13 May 2027)",rf:[32,28]},
{q:"SPDI Rules 2011 and Section 43A",k:"spdi rules 2011 sensitive personal data information 43a body corporate reasonable security practices compensation",a:"The IT (Reasonable Security Practices and Procedures and Sensitive Personal Data or Information) Rules, 2011 were made under s.43A. They bind body corporates that handle sensitive personal data such as passwords, financial details, health and biometric data. They stay in force until the DPDP Act omits s.43A on 13 May 2027, when the DPDP Act and Rules replace them."},
{q:"IT Act rules: interception, blocking, intermediaries, CERT-In",k:"interception rules 2009 blocking rules 2009 intermediary guidelines 2021 cert-in cert certin directions 2022 incident reporting six hours 6 hours logs 180 days platform takedown social media",a:"• Interception, Monitoring and Decryption Rules, 2009 (under s.69): needs an order from the competent authority (the Union or State Home Secretary), with review and record-keeping.\n• Blocking Rules, 2009 (under s.69A): the Centre blocks through a committee and a designated officer. The deck says to confirm the route with the legal cell.\n• IT (Intermediary Guidelines and Digital Media Ethics Code) Rules, 2021: duties of social media and other platforms, including grievance officers and takedown of unlawful content.\n• CERT-In Directions (28 April 2022): report specified cyber incidents within 6 hours and keep logs for 180 days.",rf:[30,28]},
{q:"BNSS 2023: sections used with data and digital evidence",k:"bnss 2023 bharatiya nagarik suraksha sanhita sections 173 94 105 fir e-fir summons produce documents audio video recording search seizure electronic procedure",a:"s.173: information in cognizable cases (the FIR), including by electronic communication (e-FIR)\ns.94: summons or order to produce a document or other thing, which can include digital records and data\ns.105: audio-video recording of search and seizure\nThe BNSS also allows many steps to be done electronically. Use the exact section and ask the legal cell for the correct procedure in your case.",rf:[28,32]},
{q:"BSA 2023: the s.63 certificate for electronic evidence",k:"bsa bharatiya sakshya adhiniyam 2023 evidence act section 63 certificate electronic record hash admissibility screenshot chain of custody",a:"BSA 2023 replaced the Indian Evidence Act, 1872. An electronic record is admissible as a document when the s.63 conditions are met. In practice you attach the s.63 certificate (the format given in the BSA schedule), signed by the person in charge of the device or system and, in that format, an expert. Note the hash value of the file so a court can see it was not changed, and keep a log of how and when it was captured (chain of custody).",rf:[28,32]},
{q:"BNS 2023: offences linked to data and identity",k:"bns bharatiya nyaya sanhita 2023 cheating personation forgery defamation stalking voyeurism victim identity disclosure ipc 228a offences",a:"BNS 2023 replaced the IPC. Offence groups linked to data and identity: cheating and cheating by personation, forgery of electronic records, defamation, stalking and voyeurism, and printing or publishing the identity of a victim of a sexual offence (the old IPC 228A). Ask the legal cell for the exact BNS section; this library does not list BNS section numbers.",rf:[25,28]},
{q:"Laws that protect victim and child identity",k:"victim identity protection child pocso section 23 juvenile justice section 74 sexual offence name address fir leak",a:"• Victims of sexual offences: it is an offence to print or publish a name or anything that identifies the victim (BNS, formerly IPC 228A), except in limited cases with safeguards.\n• POCSO Act 2012, s.23: media and others must not disclose a child victim’s identity.\n• Juvenile Justice Act 2015, s.74: no disclosure of the identity of a child in conflict with law or a child in need of care.\n• DPDP Act, s.9 (from 13 May 2027): parent consent for under-18s, and no tracking, behavioural monitoring or targeted ads aimed at children.\nThis links to Activity 1 (the leaked FIR).",rf:[6,7]},
{q:"Aadhaar Act 2016 and data",k:"aadhaar act 2016 uidai biometric core biometric information section 29 sharing authentication",a:"Aadhaar Act 2016: core biometric information (fingerprints, iris) must never be shared or used except for Aadhaar authentication (s.29). Aadhaar numbers should not be published. Disclosure beyond the Act’s limits is allowed only through the routes in s.33 (for example, a court order). Check with your legal cell before asking UIDAI for data."},
{q:"Telecommunications Act 2023",k:"telecommunications act 2023 telecom interception message suspension telegraph act replaced call records",a:"The Telecommunications Act, 2023 replaces the Indian Telegraph Act, 1885 and related old laws. It covers licensing, interception and suspension of messages on grounds such as public emergency or public safety, telecom network security, and user-data rules. It is being brought into force in phases through notified sections and rules, so check which sections are active before relying on them."},
{q:"DPDP and the RTI Act (s.44(3))",k:"rti right to information act section 8(1)(j) personal information amendment public interest override supreme court dpdp 44",a:"s.44(3) of the DPDP Act amended s.8(1)(j) of the RTI Act, 2005. The exemption now reads simply ‘information which relates to personal information’, removing the earlier public-interest balancing. Transparency groups have challenged this in the Supreme Court (heard 7 August 2026). For officers: personal information in your records may be refused under RTI, but follow your Public Information Officer’s guidance."},
{q:"Other laws that apply with DPDP",k:"official secrets act 1923 conduct rules confidentiality service rules disclosure official information section 38 other laws rbi sebi irdai trai sector",a:"The Official Secrets Act 1923 and service conduct rules limit the disclosure of official information. Sector rules (RBI for banks, SEBI, IRDAI, TRAI) may also apply to data you request from those bodies. DPDP s.38 says the Act adds to other laws, and where they conflict the DPDP Act prevails to the extent of the conflict."},
{q:"What must I do after a data breach?",k:"data breach what to do after breach duty notify board affected 8(6) steps leak response data breach what to do",a:"Under DPDP s.8(6) (from 13 May 2027) the data fiduciary must tell the Data Protection Board and each affected person about a personal data breach. Today, specified cyber incidents must also be reported to CERT-In within 6 hours under its 2022 directions.\nIn your unit: contain the leak, preserve evidence, inform your supervisor and the legal cell, and record it in the log (as in Activity 1).",rf:[7,23]}

const norm=s=>s.toLowerCase().replace(/[’']/g,"").replace(/\bit act\b/g,"itact").replace(/[^a-z0-9 ]+/g," ");
const stem=w=>w.length>4?w.replace(/(ing|ed|es|s)$/,""):w;
const toks=s=>{const o=[];norm(s).split(/\s+/).forEach(w=>{if(!w||SW.has(w))return;(SYN[w]||w).split(" ").forEach(x=>{if(x&&!SW.has(x))o.push(stem(x))})});return o};
const rep=(s,n)=>(s+" ").repeat(n);
const DOCS=[...SL.map(d=>({type:"slide",d,text:rep(d.t,3)+rep(d.k,3)+rep(d.s,2)+d.b.join(" ")+" "+d.nt})),...FQ.map(d=>({type:"faq",d,text:rep(d.q,3)+rep(d.k,3)+d.a})),...LAW.map(d=>({type:"law",d,text:rep(d.q,3)+rep(d.k,3)+d.a}))];
DOCS.forEach(x=>{x.tk=toks(x.text);x.tf={};x.tk.forEach(w=>x.tf[w]=(x.tf[w]||0)+1)});
const DF={};DOCS.forEach(x=>Object.keys(x.tf).forEach(w=>DF[w]=(DF[w]||0)+1));
const AVG=DOCS.reduce((a,x)=>a+x.tk.length,0)/DOCS.length;
function search(q){const qt=[...new Set(toks(q))];if(!qt.length)return[];const N=DOCS.length;
 return DOCS.map(x=>{let sc=0,hit=0;qt.forEach(w=>{const f=x.tf[w];if(!f)return;hit++;const idf=Math.log(1+(N-DF[w]+.5)/(DF[w]+.5));sc+=idf*f*2.4/(f+1.4*(.25+.75*x.tk.length/AVG))});
  sc*=(1+.25*hit/qt.length);if(x.type!=="slide")sc*=1.2;return{x,score:sc}}).filter(r=>r.score>0).sort((a,b)=>b.score-a.score)}
const TH=3.2;
/*END*/
const $=s=>document.querySelector(s),log=$("#log");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const short=s=>s.length>40?s.slice(0,38)+"…":s;
const chip=(q,l)=>`<button class="chip" data-q="${esc(q)}">${esc(l)}</button>`;
const sChip=n=>chip("slide "+n,"Slide "+n+": "+short(SL[n-1].t));
const notes=s=>esc(s).replace(/\b(SAY at the start|SAY|DO|ASK|TIME|LINK|NOTE|WARN|KEEP IT SHORT|REMEMBER):/g,"<b>$1:</b>");
function add(cls,html){const m=document.createElement("div");m.className="msg "+cls;const b=document.createElement("div");b.className="bubble";b.innerHTML=html;m.appendChild(b);log.appendChild(m);log.scrollTop=log.scrollHeight;return b}
const say=(t,ch)=>add("bot",`<p>${esc(t)}</p>`+(ch?`<div class="chips">${ch}</div>`:""));
function showSlide(n,also){const d=SL[n-1],open=$("#openNotes").checked?" open":"";
 add("bot",`<span class="ref">Slide ${n} · ${esc(d.t)}</span><p class="simple">${esc(d.s)}</p><ul>${d.b.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><details${open}><summary>Facilitator notes</summary><p>${notes(d.nt)}</p></details><div class="chips">${n>1?chip("slide "+(n-1),"← Slide "+(n-1)):""}${n<33?chip("slide "+(n+1),"Slide "+(n+1)+" →"):""}${(also||[]).map(sChip).join("")}</div>`)}
function showFaq(f){add("bot",`<span class="ref">${esc(f.q)}</span><p>${esc(f.a).replace(/\n/g,"<br>")}</p><p class="note">From the deck:</p><div class="chips">${f.src.map(sChip).join("")}</div>`)}
const LAWNOTE="Status checked 27 October 2026 from public sources. Confirm section numbers and dates with the official text (indiacode.nic.in, meity.gov.in) and your legal cell.";
function showLaw(f){const rf=(f.rf||[]).map(sChip).join(""),ch=(f.ch||[]).map(x=>chip(x,x)).join("")||chip("all laws related to DPDP","All related laws");
 add("bot",`<span class="ref">Law library · ${esc(f.q)}</span><p>${esc(f.a).replace(/\n/g,"<br>")}</p><p class="note">${esc(LAWNOTE)}</p><div class="chips">${ch}${rf}</div>`)}
function overview(){add("bot",`<span class="ref">Deck overview</span><p class="simple">A 33-slide teaching deck (AIP-02, 27 October 2026) for non-technical police officers. Main message: protect the source, share the lesson.</p><ul><li><b>Morning (slides 1–23, 10:00–11:30):</b> why leaks happen, the four questions (Need, Minimum, Hidden, Logged), federated learning through a cards game, k-anonymity, and red-amber-green sharing decisions.</li><li><b>Afternoon (slides 24–33, 14:30–15:30):</b> the law in four drawers (IT Act, BNSS, Evidence Act, DPDP Act), the drawer sort, three drills, and a pocket card of six section numbers.</li><li><b>Seven activities</b> follow the same rhythm: Rule, Task, Answer.</li></ul><div class="chips">${chip("list activities","See all 7 activities")}${chip("morning plan","Morning plan")}${chip("afternoon plan","Afternoon plan")}${chip("quiz me","Quiz me")}</div>`)}
function listActs(){add("bot",`<span class="ref">The 7 activities</span><ul>${Object.keys(ACT).map(k=>`<li><b>Activity ${k}: ${ACT[k][0]}</b> (slides ${ACT[k][2][0]}${ACT[k][2].length>1?"–"+ACT[k][2][ACT[k][2].length-1]:""}). ${ACT[k][1]}</li>`).join("")}</ul><div class="chips">${Object.keys(ACT).map(k=>chip("activity "+k,"Activity "+k)).join("")}</div>`)}
function showAct(n){const a=ACT[n];if(!a)return say("The deck has Activities 1 to 7.",chip("list activities","See all 7"));
 add("bot",`<span class="ref">Activity ${n}: ${esc(a[0])}</span><p class="simple">${esc(a[1])}</p><p class="note">Slides for this activity:</p><div class="chips">${a[2].map(sChip).join("")}</div>`)}
function fallback(r){const ch=r.slice(0,3).map(x=>x.x.type==="slide"?sChip(x.x.d.n):chip(x.x.d.q,x.x.d.q)).join("");
 say("I couldn’t find a clear answer to that in the deck. I only answer from the AIP-02 Facilitator Deck and the law library. Try rewording, give a slide number, or pick a topic below.",(r.length?ch:"")+chip("deck overview","Deck overview")+chip("quiz me","Quiz me"))}
function respond(q){const l=q.toLowerCase();let m;
 if(/^\s*(hi|hello|hey|namaste|help)\b/.test(l))return welcome();
 if(/\b(thanks|thank you)\b/.test(l))return say("You’re welcome! Ask another question anytime.");
 if(/\b(quiz|test me|practice questions)\b/.test(l))return startQuiz();
 if(m=l.match(/\bslide\s*(?:no\.?|number)?\s*(\d{1,2})\b/)){const n=+m[1];return n>=1&&n<=33?showSlide(n):say("The deck has slides 1 to 33.")}
 if(m=l.match(/\bactivity\s*(\d)\b/))return showAct(+m[1]);
 if(/\b(list|all|show)\b.*\bactivities\b|^\s*activities\s*$/.test(l))return listActs();
 if(/\b(all|list|show|which|related)\b.*\b(acts?|laws?)\b|\b(legal|law) library\b/.test(l)&&!/\bactivit/.test(l))return showLaw(LAW[0]);
 if(/\b(overview|summary|summari[sz]e|what is this deck|about this deck|whole deck)\b/.test(l))return overview();
 if(/\b(plan|schedule|agenda|timetable)\b/.test(l)&&!/\bdecision\b/.test(l)){const mo=/morning/.test(l),af=/afternoon/.test(l);if(mo||!af)showSlide(5);if(af||!mo)showSlide(24);return}
 const r=search(q);if(!r.length||r[0].score<TH)return fallback(r);
 const top=r[0].x,rest=r.slice(1).filter(x=>x.x.type==="slide"&&x.score>=r[0].score*.55).slice(0,2).map(x=>x.x.d.n);
 if(top.type==="faq")showFaq(top.d);else if(top.type==="law")showLaw(top.d);else showSlide(top.d.n,rest.filter(n=>n!==top.d.n))}
let qz=null;
function startQuiz(){qz={i:0,sc:0,miss:[]};add("bot",`<p class="simple">Quiz time: ${QZ.length} questions from the deck. Tap an answer.</p>`);nextQ()}
function nextQ(){const q=QZ[qz.i];add("bot",`<span class="ref">Question ${qz.i+1} of ${QZ.length}</span><p><b>${esc(q.q)}</b></p><div class="opts" data-qi="${qz.i}">${q.o.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join("")}</div>`)}
function answerQ(btn){const box=btn.parentElement,i=+box.dataset.qi;if(!qz||i!==qz.i||box.dataset.done)return;box.dataset.done=1;const q=QZ[i],j=+btn.dataset.j;
 [...box.children].forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add("good");else if(k===j)b.classList.add("wrong")});
 if(j===q.a)qz.sc++;else qz.miss.push(q.s);
 const last=i===QZ.length-1;box.insertAdjacentHTML("afterend",`<p style="margin-top:8px"><b>${j===q.a?"Correct.":"Not quite."}</b> ${esc(q.e)}</p><div class="chips">${sChip(q.s)}${last?`<button class="next" data-fin="1">See my score</button>`:`<button class="next" data-next="1">Next question →</button>`}</div>`);log.scrollTop=log.scrollHeight}
function finish(){const s=qz.sc,n=QZ.length,ms=[...new Set(qz.miss)];
 add("bot",`<span class="ref">Your score</span><p class="simple">${s} out of ${n}. ${s>=n-1?"Excellent!":s>=n*.6?"Good work.":"Keep practising."}</p>${ms.length?`<p class="note">Revise these slides:</p><div class="chips">${ms.map(sChip).join("")}</div>`:""}<div class="chips">${chip("quiz me","Try again")}</div>`);qz=null}
function welcome(){add("bot",`<p class="simple">Hi! I’m the AIP-02 Deck Assistant.</p><p>Ask me anything about the Facilitator Deck: activities and answers, plain-word meanings, timings, or the law section numbers. I answer only from the deck, in simple words.</p><div class="chips">${chip("What is federated learning?","What is federated learning?")}${chip("Explain k-anonymity","Explain k-anonymity")}${chip("What are the four questions?","The four questions")}${chip("Which section numbers should I know?","Section numbers")}${chip("morning plan","Morning plan")}${chip("Activity 4","Activity 4")}${chip("all laws related to DPDP","DPDP and related laws")}${chip("deck overview","Deck overview")}${chip("quiz me","Quiz me")}</div>`)}
function ask(q){q=q.trim();if(!q)return;const u=document.createElement("div");u.className="msg user";const b=document.createElement("div");b.className="bubble";b.textContent=q;u.appendChild(b);log.appendChild(u);respond(q);log.scrollTop=log.scrollHeight}
$("#f").addEventListener("submit",e=>{e.preventDefault();const i=$("#q");const v=i.value;i.value="";ask(v)});
log.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
 if(t.classList.contains("chip"))ask(t.dataset.q);
 else if(t.classList.contains("opt"))answerQ(t);
 else if(t.dataset.next){t.disabled=true;qz.i++;nextQ()}
 else if(t.dataset.fin){t.disabled=true;finish()}});
let dp=null;const ib=$("#inst");
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;ib.hidden=false});
ib.onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;ib.hidden=true}};
addEventListener("appinstalled",()=>{ib.hidden=true});
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone;
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
welcome();
if(ios)say("To install on iPhone or iPad: tap the Share button in Safari, then ‘Add to Home Screen’.");
</script>
</body>
